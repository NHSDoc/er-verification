<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Validation Tool</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        :root {
            /* NHS & Report Color Palette */
            --nhs-blue: #005EB8;
            --nhs-white: #FFFFFF;
            --nhs-black: #231f20;
            --nhs-dark-grey: #425563;
            --nhs-light-grey: #f0f4f5;
            --report-header: #005EB8; /* Blue headers like PDF */
            --report-text: #212b32;
            --nhs-bright-green: #007f3b;
            --nhs-red: #da291c;
        }

        body {
            font-family: "Arial", "Frutiger", sans-serif; /* Matches PDF sans-serif look */
            background-color: var(--nhs-light-grey);
            color: var(--nhs-black);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Header Section --- */
        .header {
            width: 100%;
            background-color: var(--nhs-white);
            border-bottom: 4px solid var(--nhs-blue);
            padding: 15px 0;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .header-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--nhs-blue);
            font-weight: 700;
            text-transform: uppercase;
        }

        .logo {
            height: 50px;
            /* Ensure logo.png is in your repo */
        }

        /* Refresh Button */
        .btn-refresh {
            background: var(--nhs-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .btn-refresh:hover { background: #004080; }

        /* --- Main Container --- */
        .container {
            width: 90%;
            max-width: 800px;
            background: var(--nhs-white);
            padding: 40px;
            border: 1px solid #d8dde0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        /* --- Buttons --- */
        .btn {
            background: var(--nhs-blue);
            color: var(--nhs-white);
            border: none;
            padding: 15px 20px;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover { background: #004080; }
        .btn-upload { background: var(--nhs-dark-grey); }
        .btn-stop { background: var(--nhs-red); }

        #file-input, .hidden { display: none !important; }

        /* --- Results Area --- */
        .result-box {
            margin-top: 10px;
        }

        /* Status Banner */
        .alert-box {
            padding: 15px;
            margin-bottom: 30px;
            border-left: 6px solid;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .alert-danger { border-color: var(--nhs-red); background: #fff5f5; }
        .alert-danger h3 { color: var(--nhs-red); margin: 0 0 5px 0; font-size: 1.1rem; }
        
        .alert-success { border-color: var(--nhs-bright-green); background: #f0fdf4; }
        .alert-success h3 { color: var(--nhs-bright-green); margin: 0 0 5px 0; font-size: 1.1rem; }

        /* --- Report Style Data Grid --- */
        .report-section-title {
            color: var(--nhs-blue);
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        /* Grid mimicking the PDF layout */
        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two columns */
            gap: 20px;
            margin-bottom: 30px;
        }

        .report-item {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .report-label {
            color: var(--nhs-blue);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .report-value {
            color: #000;
            font-size: 1rem;
            font-weight: 600;
            word-break: break-word;
        }

        /* Full width item for long text like GPS or Reference */
        .full-width {
            grid-column: 1 / -1;
        }

        /* Map styling */
        iframe {
            width: 100%;
            height: 350px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* Footer */
        .footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 0.8rem;
            border-top: 1px solid #ddd;
            background: #fff;
            margin-top: auto;
        }

        /* Camera */
        #video-container {
            position: relative;
            background: #000;
            overflow: hidden;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        video { width: 100%; display: block; opacity: 0.9; }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .report-grid { grid-template-columns: 1fr; }
            .container { padding: 20px; width: 95%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-content">
            <div style="display:flex; align-items:center; gap:15px;">
                <img src="logo.png" alt="ER GeoLocate" class="logo" onerror="this.style.display='none'">
                <h1>ER Verification</h1>
            </div>
            <button class="btn-refresh" onclick="location.reload()">Reset Tool</button>
        </div>
    </div>

    <div class="container">
        <div id="input-section">
            <p style="margin-bottom: 25px; color: #555; font-size: 0.95rem;">
                Upload an ER PDF or scan a QR code to verify metadata integrity and GPS location.
            </p>
            
            <button class="btn" onclick="startCamera()">Scan QR Code</button>
            <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">Upload Evidence PDF</button>
            <input type="file" id="file-input" accept="image/*,application/pdf" onchange="handleFileUpload(this)">
        </div>

        <div id="loading" class="hidden" style="text-align:center; padding:40px;">
            <div style="font-weight:bold; color:var(--nhs-blue); font-size:1.1rem; margin-bottom:10px;">ANALYZING EVIDENCE...</div>
            <div style="color:#777; font-size:0.9rem;">Extracting cryptographic metadata</div>
        </div>

        <div id="video-container" class="hidden">
            <video id="video" playsinline></video>
            <canvas id="canvas" hidden></canvas>
            <div style="padding: 15px; background: white; text-align: center;">
                <button class="btn btn-stop" style="width: auto; margin:0;" onclick="stopCamera()">Cancel Scan</button>
            </div>
        </div>

        <div id="results" class="hidden result-box">
            
            <div id="status-banner" class="alert-box hidden"></div>

            <div class="report-section-title">Evidence Metadata</div>
            <div id="report-grid" class="report-grid">
                </div>

            <div class="report-section-title">GPS Location Confirmation</div>
            <div id="map-frame"></div>
        </div>
    </div>

    <div class="footer">
        <div>ER GeoLocate Validation Tool v3.0</div>
        <div style="margin-top:5px;">&copy; 2026 Digestiv | Secure Environment</div>
    </div>

<script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let scanning = false;
    let streamRef = null;

    // --- File Handling ---
    async function handleFileUpload(input) {
        const file = input.files[0];
        if (!file) return;

        document.getElementById('input-section').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('results').classList.add('hidden');

        try {
            if (file.type === "application/pdf") {
                await processPDF(file);
            } else {
                await processImage(file);
            }
        } catch (e) {
            alert("Error: " + e.message);
            location.reload();
        }
    }

    async function processPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 3.0 }); // Higher scale for clearer QR
        
        const pdfCanvas = document.createElement('canvas');
        const pdfCtx = pdfCanvas.getContext('2d');
        pdfCanvas.height = viewport.height;
        pdfCanvas.width = viewport.width;

        await page.render({ canvasContext: pdfCtx, viewport: viewport }).promise;

        const imageData = pdfCtx.getImageData(0, 0, pdfCanvas.width, pdfCanvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        
        finishProcessing(code);
    }

    function processImage(file) {
        const reader = new FileReader();
        reader.onload = () => {
            const img = new Image();
            img.onload = () => {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = img.width;
                tempCanvas.height = img.height;
                tempCtx.drawImage(img, 0, 0);
                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                finishProcessing(code);
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    }

    function finishProcessing(code) {
        document.getElementById('loading').classList.add('hidden');
        if (code) {
            displayResults(code.data);
        } else {
            alert("Unable to locate a valid QR code in this document.");
            location.reload();
        }
    }

    // --- Camera Handling ---
    function startCamera() {
        document.getElementById('input-section').classList.add('hidden');
        document.getElementById('video-container').classList.remove('hidden');
        scanning = true;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then((stream) => {
            streamRef = stream;
            video.srcObject = stream;
            video.play();
            requestAnimationFrame(tick);
        });
    }

    function stopCamera() {
        scanning = false;
        if (streamRef) {
            streamRef.getTracks().forEach(track => track.stop());
        }
        document.getElementById('video-container').classList.add('hidden');
        document.getElementById('input-section').classList.remove('hidden');
    }

    function tick() {
        if (!scanning) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
            if (code) {
                scanning = false;
                streamRef.getTracks().forEach(track => track.stop());
                document.getElementById('video-container').classList.add('hidden');
                displayResults(code.data);
            }
        }
        requestAnimationFrame(tick);
    }

    // --- Display & Logic ---
    function displayResults(rawJson) {
        document.getElementById('results').classList.remove('hidden');
        const grid = document.getElementById('report-grid');
        const banner = document.getElementById('status-banner');
        
        let data = {};
        try { data = JSON.parse(rawJson); } catch(e) { data = { "RAW DATA": rawJson }; }

        // Generate HTML matching the PDF Layout
        let html = '';
        
        // Helper to decide if a field should be full width
        const isFullWidth = (key) => ["GPS Coordinates", "Reference", "GPS", "Location", "NHS Trust", "Lead Employer"].some(term => key.includes(term));

        for (const [key, value] of Object.entries(data)) {
            // Convert camelCase or normal keys to UPPERCASE for titles
            const label = key.replace(/([A-Z])/g, ' $1').trim().toUpperCase();
            const widthClass = isFullWidth(key) ? 'full-width' : '';
            
            html += `
                <div class="report-item ${widthClass}">
                    <div class="report-label">${label}</div>
                    <div class="report-value">${value}</div>
                </div>
            `;
        }
        grid.innerHTML = html;

        // Spoof Check (Altitude)
        // Check for various common altitude keys
        const altKey = Object.keys(data).find(k => k.toLowerCase().includes('alt'));
        const altVal = altKey ? parseFloat(data[altKey]) : 10; // Default to safe if missing

        if (altVal === 0) {
            banner.className = "alert-box alert-danger";
            banner.innerHTML = "<h3>⚠️ SPOOF DETECTED</h3>Altitude data is 0m. This strongly indicates the location was generated by a computer proxy/emulator.";
        } else {
            banner.className = "alert-box alert-success";
            banner.innerHTML = "<h3>✅ VERIFIED AUTHENTIC</h3>Metadata integrity confirmed. GPS signature matches physical receiver characteristics.";
        }
        banner.classList.remove('hidden');

        // Map Generation
        // Look for Latitude/Longitude keys (case insensitive)
        const latKey = Object.keys(data).find(k => k.toLowerCase().startsWith('lat'));
        const lngKey = Object.keys(data).find(k => k.toLowerCase().startsWith('lon') || k.toLowerCase().startsWith('lng'));
        
        let lat = latKey ? data[latKey] : null;
        let lng = lngKey ? data[lngKey] : null;

        // Clean coordinates (remove letters if present, though usually clean in JSON)
        if (lat) lat = lat.toString().replace(/[^\d.-]/g, '');
        if (lng) lng = lng.toString().replace(/[^\d.-]/g, '');

        if (lat && lng) {
            // Using "q=loc:lat,lng" places a pin at the exact spot. 
            // "t=h" sets Hybrid view (Satellite + Roads) to match the visual density of the PDF map.
            document.getElementById('map-frame').innerHTML = 
                `<iframe src="https://maps.google.com/maps?q=${lat},${lng}&t=h&z=15&ie=UTF8&iwloc=&output=embed" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"></iframe>`;
        } else {
            document.getElementById('map-frame').innerHTML = "<div style='padding:20px; text-align:center; color:#777;'>No valid GPS coordinates found in QR data.</div>";
        }
    }
</script>

</body>
</html>
